# override in application-default.properties
baseUrl=http://localhost:8080

vaadin.frontend.hotdeploy=true

server.servlet.session.timeout=4h

# == email (SMTP) ==
# Defaults so the JavaMailSender bean is always available; on localhost no email is actually sent
# (the email is confirmed immediately). Override host/port/username/password in production.
spring.mail.host=localhost
spring.mail.port=25

spring.jpa.properties.hibernate.default_batch_fetch_size=1024
spring.jpa.generate-ddl=false
# validate the entities vs the database schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# == liquibase ==
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
#spring.liquibase.secureParsing=false # this is not picked up, moved to main as system property
spring.liquibase.dropFirst=false
spring.liquibase.user=${spring.datasource.username}
spring.liquibase.password=${spring.datasource.password}

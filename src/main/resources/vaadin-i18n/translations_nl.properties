skilllevel.absolute_beginner=Beginner
skilllevel.absolute_beginner.description=Richt zich op basisritme, het zetten van de basispassen en het onthouden van choreografie. Leiden/volgen is rudimentair, navigeren over de vloer vergt veel aandacht.
skilllevel.novice=Nieuweling
skilllevel.novice.description=Blijft consequent in de maat en voert standaard beginner figuren zonder stoppen uit. Kan met een vertrouwde partner basale overgangen leiden/volgen.
skilllevel.intermediate_social=Intermediate social
skilllevel.intermediate_social.description=Vertrouwd met timing, basale uitlijning en standaard floor craft op sociale dansavonden. Eenvoudige rise-and-fall of heupactie.
skilllevel.advanced_social=Gevorderd recreatief
skilllevel.advanced_social.description=Danst moeiteloos met wisselende partners op volledig tempo. Solide gewichtsverplaatsing, consistente connectie/frame, zuiver voetwerk (bewustzijn van binnen- en buitenkant).
skilllevel.pre_competitive=Pre-competitie (instap / D-klasse)
skilllevel.pre_competitive.description=Overgang van sociale uitvoering naar competitietechniek. Toont bewuste voetplaatsing, gewichtsverdeling van het hoofd, fundamentele swing en sway of duidelijke Cuban motion, en een zuivere houding gedurende hele routines.
skilllevel.regional_competitor=Regionaal deelnemer (C-klasse)
skilllevel.regional_competitor.description=Vloeiende beweging over de vloer. Begrijpt rotatiemechanica, body flight en dynamisch shapen. Duidelijke partnerconnectie en solide musicaliteit.
skilllevel.national_competitor=Landelijk deelnemer (B-klasse)
skilllevel.national_competitor.description=Hoge technische vaardigheid en conditie. Beweging is krachtig, continu en gegrond. Toont expressieve muzikale frasering, sterke dominantie op de vloer en verfijnde contra-body-mechanica.
skilllevel.national_finalist=Landelijk finalist (A-klasse)
skilllevel.national_finalist.description=Naadloze synchronisatie en geavanceerde choreografische lijnen. Extreme snelheid, dynamische acceleratie/remming en moeiteloze core-connectie onder hoge cardiovasculaire belasting. Haalt regelmatig landelijke finales.
skilllevel.international_class=Internationale klasse (S-klasse)
skilllevel.international_class.description=Technische precisie op wereldniveau, moeiteloos volume en een eigen artistieke identiteit. Speelt vloeiend met muzikale micro-timing en body flight. Vertegenwoordigt regelmatig het land in internationale opens, kwartfinales en halve finales.
skilllevel.world_elite=Kampioenschapsfinalist
skilllevel.world_elite.description=Onfeilbare balans, transcendente fysieke volume, volledige meesterschap van artistieke interpretatie en nagenoeg feilloze biomechanica onder extreme druk.

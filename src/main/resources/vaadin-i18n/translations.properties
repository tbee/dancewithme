form.role=Role

skilllevel1=Absolute Beginner
skilllevel1.description=Focuses on basic rhythm, surviving basic steps, and remembering choreography. Lead/follow is rudimentary, posture is stiff, and floor navigation requires full attention.
skilllevel2=Novice
skilllevel2.description=Consistently stays on the beat and executes standard Bronze-level syllabi without stopping. Can lead/follow basic transitions with a familiar partner.
skilllevel3=Intermediate Social
skilllevel3.description=Comfortable with timing, basic alignment, and standard floor craft at social dances. Starts demonstrating basic rise-and-fall or Latin hip action, though upper-body frame still fluctuates under movement.
skilllevel4=Advanced Social
skilllevel4.description=Dances with varied partners effortlessly to full-tempo music. Shows solid weight transfer, consistent connection/frame, clean footwork (inside/outside edge awareness), and Silver-level figures.
skilllevel5=Pre-Competitive (Entry / D-Class)
skilllevel5.description=Transitions from social execution to competitive mechanics. Demonstrates deliberate foot placement, head weight distribution, fundamental swing and sway or clear Cuban motion, and clean posture throughout full routines.
skilllevel6=Regional Competitor (C-Class)
skilllevel6.description=Fluid movement across the floor. Understands rotational mechanics, body flight, and dynamic shaping. Can execute complex Gold/Open syllabus figures with clear partner connection and solid musicality.
skilllevel7=National Competitor (B-Class)
skilllevel7.description=High technical proficiency and conditioning. Movement is powerful, continuous, and grounded. Displays expressive musical phrasing, strong floor dominance, and refined counter-body mechanics.
skilllevel8=National Finalist / Elite (A-Class)
skilllevel8.description=Seamless synchronization and advanced choreographic lines. Demonstrates extreme speed, dynamic acceleration/deceleration, and effortless core connection under high cardiovascular demand. Routinely makes national-level finals.
skilllevel9=International Class (S-Class / WDSF & WDC Major Competitor)
skilllevel9.description=World-tier technical precision, effortless volume, and distinct artistic identity. Fluidly manipulates musical micro-timing and body flight. Regularly represents their country in international opens, quarter-finals, and semi-finals.
skilllevel10=World Elite / Grand Slam & Championship Finalist
skilllevel10.description=The definitive standard of the discipline (Blackpool/World Championship finalists and champions). Infallible balance, transcendent physical volume, complete mastery of artistic interpretation, and near-flawless biomechanics under extreme performance pressure.
